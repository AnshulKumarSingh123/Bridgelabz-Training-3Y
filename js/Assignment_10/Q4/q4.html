<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Q4 Multi-API Dashboard</title>
<link rel="stylesheet" href="../style.css"><style>
#cards{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;text-align:center;padding:20px;background:#e7f5ff;border-radius:10px}
.stat h2{margin:6px 0;font-size:34px}
.skeleton{background:linear-gradient(90deg,#e9ecef 25%,#f8f9fa 50%,#e9ecef 75%);background-size:200% 100%;animation:sh 1.2s infinite;color:transparent!important;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}.warn{background:#fff3bf;color:#e67700;padding:10px;border-radius:6px;display:none}</style></head><body>
<header><h1>Dashboard</h1></header>
<main><section><div class="warn" id="warn">Some data could not be loaded.</div><div id="cards">
<div class="stat"><p>Total Users</p><h2 id="users">0000</h2></div>
<div class="stat"><p>Total Orders</p><h2 id="orders">0000</h2></div>
<div class="stat"><p>Total Products</p><h2 id="products">0000</h2></div></div></section></main>
<script src="q4.js"></script></body></html>
